[project]
name = "mcp-catalog-workshop"
version = "0.1.0"
description = "An unofficial educational MCP catalog for Azure and Copilot Studio"
requires-python = ">=3.12,<3.15"
dependencies = [
    "aiohttp>=3.13,<4",
    "azure-data-tables>=12.7,<13",
    "azure-identity>=1.26,<2",
    "cryptography>=50,<51",
    "fastmcp-slim[server]==4.1.1",
    "mcp==2.3.0",
    "httpx2>=2,<3",
    "pydantic>=2.12,<3",
    "pyjwt[crypto]>=2.15,<3",
    "py-key-value-aio[azure-tables]==0.4.6",
    "starlette>=0.49,<2",
    "truststore>=0.10,<1",
    "uvicorn>=0.38,<1",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.14,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
